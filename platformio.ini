; PlatformIO build config for MHI-AC-Ctrl
; Build:   pio run -e d1_mini          (or -e lolin_s3_mini; plain `pio run` builds all)
; Flash:   pio run -e d1_mini -t upload
;          pio run -e d1_mini_ota -t upload   (OTA, set upload_port to the device IP)
; Monitor: pio device monitor
;
; WiFi is configured at runtime via the setup AP (see README). Optional build-time
; defaults (MQTT broker, setup AP password, OTA password) go in secrets.ini
; (copy secrets.ini.example), it is git-ignored.

[platformio]
src_dir = src
extra_configs = secrets*.ini

[secrets]
build_flags =

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    hmueller01/PubSubClient3
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    tzapu/WiFiManager@^2.0.17
build_flags =
    ${secrets.build_flags}

; ---------- WeMos D1 mini (ESP8266) - the original MHI-AC-Ctrl board ----------
[esp8266]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L     ; recommended by upstream for stability

[env:d1_mini]
extends = esp8266

[env:d1_mini_ota]
extends = esp8266
upload_protocol = espota
upload_port = MHI-AC-Ctrl.local

; ---------- WeMos LOLIN S3 mini (ESP32-S3) ----------
; Pins match the D1 mini header positions used by the MHI-AC-Ctrl PCB
; (from the official LOLIN S3 mini pinout, outer header rows):
;   D5 (SCK)  -> GPIO12    D6 (MISO) -> GPIO13
;   D7 (MOSI) -> GPIO11    D2 (DS18x20) -> GPIO35
; Change them if you wire the S3 mini yourself.
[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1      ; route Serial to the native USB port
    -DSCK_PIN=12
    -DMOSI_PIN=11
    -DMISO_PIN=13
    -DONE_WIRE_BUS=35
